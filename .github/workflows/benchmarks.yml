name: Benchmarks

# Compares a module's benchmarks (the core module by default) between two
# refs with benchstat.
# Runs on every push to main (against the previous commit) and on demand.
# Results go to the job summary and an artifact; the job never fails on a
# slowdown, because shared runners are too noisy to gate on.

on:
  push:
    branches: [main]
    paths: ['**.go', 'go.mod']
  workflow_dispatch:
    inputs:
      base:
        description: Ref to compare against
        required: true
        default: v0.5.0
      head:
        description: Ref to measure
        required: true
        default: main
      module:
        description: Module directory to benchmark, for example benchmarks/otelexport
        required: true
        default: .

permissions:
  contents: read

concurrency:
  # One group per commit: back-to-back merges each keep their comparison.
  group: ${{ github.workflow }}-${{ github.sha }}-${{ inputs.base }}-${{ inputs.head }}-${{ inputs.module }}
  cancel-in-progress: false

jobs:
  compare:
    name: benchstat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNS: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Choose refs
        id: refs
        env:
          BASE: ${{ inputs.base }}
          HEAD: ${{ inputs.head }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            base=$BASE head=$HEAD
          else
            base=$BEFORE head=$GITHUB_SHA
            # A first push has no previous commit and a force push may point
            # at one that no longer exists: fall back to the parent commit.
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              if ! base=$(git rev-parse --verify --quiet "${GITHUB_SHA}^"); then
                echo "::notice::No previous commit to compare against."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          for ref in "$base" "$head"; do
            git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null || { echo "::error::Unknown ref: $ref"; exit 1; }
          done
          { echo "base=$base"; echo "head=$head"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - name: Run benchmarks
        if: steps.refs.outputs.skip != 'true'
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          MODULE: ${{ inputs.module || '.' }}
        run: |
          set -euo pipefail
          case "$MODULE" in
            *..*|/*) echo "::error::Invalid module: $MODULE"; exit 1 ;;
          esac
          # Build both test binaries first, then alternate runs so that
          # changes in runner load affect both sides equally. Benchmarks live
          # in each module's root package.
          for side in base head; do
            ref=$BASE; [ "$side" = head ] && ref=$HEAD
            git worktree add --detach "/tmp/$side" "$ref"
            if [ ! -d "/tmp/$side/$MODULE" ]; then
              echo "::error::Module $MODULE does not exist at $ref ($side)."
              exit 1
            fi
            if ! (cd "/tmp/$side/$MODULE" && go test -c -o "/tmp/$side.test" .); then
              echo "::error::Benchmarks at $ref ($side) do not build with $(go version | cut -d' ' -f3)."
              exit 1
            fi
          done
          for i in $(seq 1 "$RUNS"); do
            for side in base head; do
              (cd "/tmp/$side/$MODULE" && "/tmp/$side.test" -test.run '^$' -test.bench . -test.benchmem -test.count 1) >> "$side.txt"
            done
          done
      - name: Compare
        if: steps.refs.outputs.skip != 'true'
        env:
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
          MODULE: ${{ inputs.module || '.' }}
        run: |
          {
            echo "### Benchmarks of \`$MODULE\`: \`$BASE\` vs \`$HEAD\`"
            echo
            echo "Runner: $(nproc) vCPU, $(go version | cut -d' ' -f3). $RUNS alternating runs each."
            echo
            echo '```'
            benchstat base=base.txt head=head.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.refs.outputs.skip != 'true'
        with:
          name: benchmarks
          path: |
            base.txt
            head.txt
