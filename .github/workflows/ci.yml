name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test with Race Detector
        run: go test -race -v ./...

      - name: Run Volume & Fidelity Demo
        run: go run ./cmd/demo

      - name: Run Benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...
