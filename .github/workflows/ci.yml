name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check Formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet (root module)
        run: go vet ./...

      - name: Test with Race Detector (root module)
        run: go test -race -v ./...

      - name: Vet & Test with Race Detector (grpcflightrec)
        working-directory: grpcflightrec
        run: |
          go vet ./...
          go test -race -v ./...

      - name: Vet & Test with Race Detector (otelflightrec)
        working-directory: otelflightrec
        run: |
          go vet ./...
          go test -race -v ./...
          go test -bench=. -benchmem -run=^$ ./...

      - name: Run Volume & Fidelity Demo
        run: go run ./cmd/demo

      - name: Run Benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...

  modules:
    # Builds each submodule the way a consumer does: without the local replace
    # directive, against the core version its go.mod requires. A failure means
    # the submodule needs a core release that has not been tagged yet.
    name: Submodules build without replace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [grpcflightrec, otelflightrec]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build and vet without replace
        working-directory: ${{ matrix.module }}
        env:
          GOFLAGS: -mod=mod
        run: |
          go mod edit -dropreplace=github.com/divine-ai-com/flightrec
          go build ./...
          go vet ./...
