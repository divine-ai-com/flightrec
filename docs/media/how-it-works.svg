.571%{opacity:.6}100.000%{opacity:.6}}.k13{animation:k13 14.0s linear infinite both}@keyframes k14{0.000%{opacity:.6}71.429%{opacity:.6}74.286%{opacity:1}95.000%{opacity:1}97.857%{opacity:.6}100.000%{opacity:.6}}.k14{animation:k14 14.0s linear infinite both}@keyframes m15{0%,4.286%{offset-distance:0%;opacity:0}4.296%{opacity:1}10.714%{offset-distance:100%;opacity:1}12.857%,100%{offset-distance:100%;opacity:0}}.m15{offset-path:path('M120 300 C190 300 220 330 300 330');offset-rotate:0deg;animation:m15 14.0s linear infinite both}@keyframes m16{0%,50.000%{offset-distance:0%;opacity:0}50.010%{opacity:1}56.429%{offset-distance:100%;opacity:1}58.571%,100%{offset-distance:100%;opacity:0}}.m16{offset-path:path('M120 300 C190 300 220 330 300 330');offset-rotate:0deg;animation:m16 14.0s linear infinite both}@keyframes m17{0%,30.000%{offset-distance:0%;opacity:0}30.010%{opacity:1}35.714%{offset-distance:100%;opacity:1}37.857%,100%{offset-distance:100%;opacity:0}}.m17{offset-path:path('M730 300 C810 300 810 245 930 245');offset-rotate:0deg;animation:m17 14.0s linear infinite both}@keyframes m18{0%,75.714%{offset-distance:0%;opacity:0}75.724%{opacity:1}81.429%{offset-distance:100%;opacity:1}83.571%,100%{offset-distance:100%;opacity:0}}.m18{offset-path:path('M730 460 C810 460 810 470 930 470');offset-rotate:0deg;animation:m18 14.0s linear infinite both}@keyframes m19{0%,77.000%{offset-distance:0%;opacity:0}77.010%{opacity:1}82.714%{offset-distance:100%;opacity:1}84.857%,100%{offset-distance:100%;opacity:0}}.m19{offset-path:path('M730 460 C810 460 810 470 930 470');offset-rotate:0deg;animation:m19 14.0s linear infinite both}@keyframes m20{0%,78.286%{offset-distance:0%;opacity:0}78.296%{opacity:1}84.000%{offset-distance:100%;opacity:1}86.143%,100%{offset-distance:100%;opacity:0}}.m20{offset-path:path('M730 460 C810 460 810 470 930 470');offset-rotate:0deg;animation:m20 14.0s linear infinite both}@keyframes m21{0%,79.571%{offset-distance:0%;opacity:0}79.581%{opacity:1}85.286%{offset-distance:100%;opacity:1}87.429%,100%{offset-distance:100%;opacity:0}}.m21{offset-path:path('M730 460 C810 460 810 470 930 470');offset-rotate:0deg;animation:m21 14.0s linear infinite both}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#172033" stroke-width="1"/></pattern><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker><marker id="arrw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs><rect width="1280" height="720" fill="#090d16"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="417" y="22" width="447" height="62" rx="6" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7" class="flow"/><text x="640.0" y="64" fill="#f8fafc" font-size="34" font-weight="600" text-anchor="middle">How flightrec Works</text><text x="640.0" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">Debug logs are kept per request and written only when the request fails</text><g class="" transform="translate(110 330)"><circle cx="0" cy="-34" r="22" fill="#fcd9b6"/><path d="M-22 -40c2-18 42-18 44 0c-6-10-38-10-44 0z" fill="#1e293b"/><path d="M-38 30c0-30 16-40 38-40s38 10 38 40z" fill="#2563eb"/><rect x="-46" y="8" width="70" height="44" rx="6" fill="#94a3b8"/><rect x="-42" y="12" width="62" height="36" rx="4" fill="#cbd5e1"/></g><g class=""><rect x="64" y="403" width="91" height="34" rx="17" fill="#1d4ed8"/><text x="110" y="426.1" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">Client</text></g><text x="110" y="455" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">HTTP / gRPC requests</text><g class="" filter="url(#soft)"><rect x="250" y="160" width="520" height="400" rx="16" fill="#f3f7ff" stroke="#f97316" stroke-width="5"/></g><g class=""><rect x="421" y="142" width="178" height="36" rx="18" fill="#1d4ed8" stroke="#ffffff" stroke-opacity=".25"/><text x="510" y="166" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">Your service</text></g><g class=""><rect x="305" y="201" width="150" height="28" rx="14" fill="#2563eb"/><text x="380" y="220.0" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">HTTPMiddleware</text></g><g class=""><rect x="530" y="201" width="141" height="28" rx="14" fill="#2563eb"/><text x="600" y="220.0" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">grpcflightrec</text></g><rect x="290" y="250" width="440" height="56" rx="10" fill="#0b1220"/><text class="mono " x="306" y="284" fill="#a5f3fc" font-size="15" font-weight="400" text-anchor="start">slog.DebugContext(ctx, &quot;charging card&quot;, ...)</text><rect x="290" y="326" width="440" height="210" rx="12" fill="#e7efff" stroke="#2563eb" stroke-width="2.5"/><text x="510" y="354" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">flightrec Recorder: one buffer per request</text><g class="" transform="translate(330 440)"><g class="sp1"><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(0)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(45)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(90)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(135)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(180)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(225)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(270)"/><rect x="-4.0" y="-27.5" width="7.9" height="11.0" rx="2" fill="#16a34a" transform="rotate(315)"/><circle r="22" fill="#16a34a"/><circle r="9.2" fill="#f3f7ff"/></g></g><text x="330" y="492" fill="#475569" font-size="13" font-weight="400" text-anchor="middle">scope</text><rect x="380" y="376" width="330" height="134" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/><rect class="k2" x="394" y="390" width="250" height="12" rx="6" fill="#94a3b8"/><rect class="k3" x="394" y="414" width="200" height="12" rx="6" fill="#94a3b8"/><rect class="k4" x="394" y="438" width="280" height="12" rx="6" fill="#94a3b8"/><rect class="k5" x="394" y="462" width="170" height="12" rx="6" fill="#94a3b8"/><rect class="k6" x="394" y="390" width="240" height="12" rx="6" fill="#38bdf8"/><rect class="k7" x="394" y="414" width="190" height="12" rx="6" fill="#38bdf8"/><rect class="k8" x="394" y="438" width="270" height="12" rx="6" fill="#38bdf8"/><rect class="k9" x="394" y="462" width="210" height="12" rx="6" fill="#38bdf8"/><g class="k10"><rect x="394" y="486" width="300" height="18" rx="6" fill="#ef4444"/><text class="mono" x="404" y="500" fill="#fff" font-size="13" font-weight="700">ERROR payment declined</text></g><text x="545" y="528" fill="#475569" font-size="12" font-weight="400" text-anchor="middle">in memory, bounded per request and per process</text><g class="k11"><rect x="417" y="583" width="186" height="34" rx="17" fill="#16a34a"/><text x="510" y="606.1" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">200 OK: healthy</text></g><g class="k12"><rect x="401" y="583" width="218" height="34" rx="17" fill="#ef4444"/><text x="510" y="606.1" fill="#fff" font-size="17" font-weight="600" text-anchor="middle">Error log: trigger</text></g><g class="k13" filter="url(#soft)"><rect x="850" y="170" width="380" height="150" rx="16" fill="#f3f7ff" stroke="#16a34a" stroke-width="5"/></g><g class="k13"><rect x="934" y="152" width="212" height="36" rx="18" fill="#16a34a" stroke="#ffffff" stroke-opacity=".25"/><text x="1040" y="176" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">Healthy request</text></g><g class="k13"><text x="1040" y="236" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">debug lines dropped</text><text x="1040" y="266" fill="#475569" font-size="16" font-weight="400" text-anchor="middle">1 summary line written</text><rect class="" x="935" y="284" width="210" height="12" rx="6" fill="#4ade80"/></g><g class="k14" filter="url(#soft)"><rect x="850" y="380" width="380" height="180" rx="16" fill="#f3f7ff" stroke="#ef4444" stroke-width="5"/></g><g class="k14"><rect x="940" y="362" width="201" height="36" rx="18" fill="#ef4444" stroke="#ffffff" stroke-opacity=".25"/><text x="1040" y="386" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">Failed request</text></g><g class="k14"><text x="1040" y="446" fill="#0f172a" font-size="18" font-weight="700" text-anchor="middle">every buffered line written</text><text x="1040" y="474" fill="#475569" font-size="15" font-weight="400" text-anchor="middle">in order, with the trace ID and reason</text><rect class="" x="925" y="492" width="230" height="9" rx="6" fill="#38bdf8"/><rect class="" x="925" y="506" width="180" height="9" rx="6" fill="#38bdf8"/><rect class="" x="925" y="520" width="260" height="9" rx="6" fill="#38bdf8"/><rect class="" x="925" y="534" width="200" height="9" rx="6" fill="#38bdf8"/></g><path class=" flow" d="M170 330 C210 330 220 330 246 330" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 6" marker-end="url(#arrw)"/><path class=" flow" d="M772 300 C810 300 810 245 846 245" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 6" marker-end="url(#arrg)"/><path class=" flow" d="M772 460 C810 460 810 470 846 470" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 6" marker-end="url(#arrr)"/><g class="m15"><circle r="8" fill="#4ade80" filter="url(#glow)"/><rect x="-60" y="-38" width="119" height="22" rx="11" fill="#4ade80"/><text y="-22" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">GET /orders</text></g><g class="m16"><circle r="8" fill="#f97316" filter="url(#glow)"/><rect x="-73" y="-38" width="146" height="22" rx="11" fill="#f97316"/><text y="-22" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">POST /checkout</text></g><g class="m17"><circle r="8" fill="#4ade80" filter="url(#glow)"/><rect x="-37" y="-38" width="74" height="22" rx="11" fill="#4ade80"/><text y="-22" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">1 line</text></g><g class="m18"><circle r="6" fill="#38bdf8" filter="url(#glow)"/></g><g class="m19"><circle r="6" fill="#38bdf8" filter="url(#glow)"/></g><g class="m20"><circle r="6" fill="#38bdf8" filter="url(#glow)"/></g><g class="m21"><circle r="6" fill="#38bdf8" filter="url(#glow)"/></g><text x="640" y="650" fill="#94a3b8" font-size="15" font-weight="700" text-anchor="middle">Triggers</text><g class=""><rect x="162" y="676" width="106" height="28" rx="14" fill="#1e293b"/><text x="215" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Error log</text></g><g class=""><rect x="297" y="676" width="167" height="28" rx="14" fill="#1e293b"/><text x="380" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">5xx / gRPC error</text></g><g class=""><rect x="480" y="676" width="80" height="28" rx="14" fill="#1e293b"/><text x="520" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Panic</text></g><g class=""><rect x="584" y="676" width="132" height="28" rx="14" fill="#1e293b"/><text x="650" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Slow request</text></g><g class=""><rect x="733" y="676" width="115" height="28" rx="14" fill="#1e293b"/><text x="790" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Flush(ctx)</text></g><g class=""><rect x="864" y="676" width="193" height="28" rx="14" fill="#1e293b"/><text x="960" y="695.0" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">Downstream / remote</text></g></svg>