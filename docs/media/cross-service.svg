 linear infinite both}@keyframes m13{0%,56.429%{offset-distance:0%;opacity:0}56.439%{opacity:1}63.571%{offset-distance:100%;opacity:1}65.714%,100%{offset-distance:100%;opacity:0}}.m13{offset-path:path('M336 580 C220 580 220 520 220 474');offset-rotate:0deg;animation:m13 14.0s linear infinite both}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#172033" stroke-width="1"/></pattern><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker><marker id="arrw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs><rect width="1280" height="720" fill="#090d16"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="358" y="22" width="565" height="62" rx="6" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7" class="flow"/><text x="640.0" y="64" fill="#f8fafc" font-size="34" font-weight="600" text-anchor="middle">Keep Logs Across Services</text><text x="640.0" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">A failure deep in the call chain keeps the logs of every service that handled