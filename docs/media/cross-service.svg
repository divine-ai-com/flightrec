<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d"><title id="t">Cross-service flush</title><desc id="d">When inventory fails, the Flightrec-Flush response header travels back up to orders and gateway, and a notifier (Redis or NATS) tells services that already finished, so every service keeps its logs for the request.</desc><style>text{font-family:Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace} .pop,.g{transform-box:fill-box;transform-origin:center} @media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important;animation-delay:-10.00s!important}}@keyframes flow{to{stroke-dashoffset:-36}} .flow{animation:flow .9s linear infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} .pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes sp1{to{transform:rotate(360deg)}} .sp1{transform-box:fill-box;transform-origin:center;animation:sp1 6s linear infinite}@keyframes sp2{to{transform:rotate(360deg)}} .sp2{transform-box:fill-box;transform-origin:center;animation:sp2 6s linear infinite}@keyframes sp3{to{transform:rotate(360deg)}} .sp3{transform-box:fill-box;transform-origin:center;animation:sp3 6s linear infinite}@keyframes m4{0%,3.571%{offset-distance:0%;opacity:0}3.581%{opacity:1}9.286%{offset-distance:100%;opacity:1}11.429%,100%{offset-distance:100%;opacity:0}}.m4{offset-path:path('M372 220 L484 220');offset-rotate:0deg;animation:m4 14.0s linear infinite both}@keyframes m5{0%,10.000%{offset-distance:0%;opacity:0}10.010%{opacity:1}15.714%{offset-distance:100%;opacity:1}17.857%,100%{offset-distance:100%;opacity:0}}.m5{offset-path:path('M792 220 L904 220');offset-rotate:0deg;animation:m5 14.0s linear infinite both}@keyframes k6{0.000%{opacity:0;transform:scale(.85)}17.143%{opacity:0;transform:scale(.85)}20.000%{opacity:1;transform:scale(1)}95.714%{op