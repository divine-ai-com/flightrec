<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d"><title id="t">Crash recovery</title><desc id="d">Buffered records are also written to a memory-mapped journal file. After kill -9, the next start recovers the requests that were in flight and writes their debug logs, tagged crash_recovery.</desc><style>text{font-family:Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'DejaVu Sans', sans-serif} .mono{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace} .pop,.g{transform-box:fill-box;transform-origin:center} @media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}@keyframes flow{to{stroke-dashoffset:-36}} .flow{animation:flow .9s linear infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}} .pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes k1{0.000%{opacity:1}33.333%{opacity:1}35.333%{opacity:.25}50.667%{opacity:.25}52.667%{opacity:1}100.000%{opacity:1}}.k1{animation:k1 15.0s linear infinite both}@keyframes k2{0.000%{opacity:0}4.000%{opacity:0}6.000%{opacity:1}100.000%{opacity:1}}.k2{animation:k2 15.0s linear infinite both}@keyframes k3{0.000%{opacity:0}7.333%{opacity:0}9.333%{opacity:1}100.000%{opacity:1}}.k3{animation:k3 15.0s linear infinite both}@keyframes k4{0.000%{opacity:0}10.667%{opacity:0}12.667%{opacity:1}100.000%{opacity:1}}.k4{animation:k4 15.0s linear infinite both}@keyframes k5{0.000%{opacity:0}6.667%{opacity:0}8.667%{opacity:1}100.000%{opacity:1}}.k5{animation:k5 15.0s linear infinite both}@keyframes k6{0.000%{opacity:0}10.000%{opacity:0}12.000%{opacity:1}100.000%{opacity:1}}.k6{animation:k6 15.0s linear infinite both}@keyframes k7{0.000%{opacity:0}13.333%{opacity:0}15.333%{opacity:1}100.000%{opacity:1}}.k7{animation:k7 15.0s linear infinite both}@keyframes k8{0.000%{opacity:0}9.333%{opacity:0}11.333%{opacity:1}100.000%{opacity:1}}.k8{animation:k8 15.0s linear infinite both}@keyframes k9{0.000%{opacity:0}12.667%{opacity:0}14.667%{opacity:1}100.000%{opacity:1}}.k9{animation:k9 15.0s linear infinite both}@keyframes k10{0.000%{opacity:0}16.000%{opacity:0}18.000%{opacity:1}100.000%{opacity:1}}.k10{animation:k10 15.0s linear infinite both}@keyframes m11{0%,5.333%{offset-distance:0%;opacity:0}5.343%{opacity:1}10.000%{offset-distance:100%;opacity:1}12.000%,100%{offset-distance:100%;opacity:0}}.m11{offset-path:path('M470 300 C540 300 560 340 650 340');offset-rotate:0deg;animation:m11 15.0s linear infinite both}@keyframes m12{0%,10.000%{offset-distance:0%;opacity:0}10.010%{opacity:1}14.667%{offset-distance:100%;opacity:1}16.667%,100%{offset-distance:100%;opacity:0}}.m12{offset-path:path('M470 300 C540 300 560 340 650 340');offset-rotate:0deg;animation:m12 15.0s linear infinite both}@keyframes m13{0%,14.667%{offset-distance:0%;opacity:0}14.677%{opacity:1}19.333%{offset-distance:100%;opacity:1}21.333%,100%{offset-distance:100%;opacity:0}}.m13{offset-path:path('M470 300 C540 300 560 340 650 340');offset-rotate:0deg;animation:m13 15.0s linear infinite both}@keyframes m14{0%,19.333%{offset-distance:0%;opacity:0}19.343%{opacity:1}24.000%{offset-distance:100%;opacity:1}26.000%,100%{offset-distance:100%;opacity:0}}.m14{offset-path:path('M470 300 C540 300 560 340 650 340');offset-rotate:0deg;animation:m14 15.0s linear infinite both}@keyframes m15{0%,24.000%{offset-distance:0%;opacity:0}24.010%{opacity:1}28.667%{offset-distance:100%;opacity:1}30.667%,100%{offset-distance:100%;opacity:0}}.m15{offset-path:path('M470 300 C540 300 560 340 650 340');offset-rotate:0deg;animation:m15 15.0s linear infinite both}@keyframes k16{0.000%{opacity:0;transform:scale(.85)}32.000%{opacity:0;transform:scale(.85)}34.667%{opacity:1;transform:scale(1)}52.000%{opacity:1;transform:scale(1)}54.667%{opacity:0;transform:scale(.85)}100.000%{opacity:0;transform:scale(.85)}}.k16{animation:k16 15.0s linear infinite both}.k16{transform-box:fill-box;transform-origin:center}@keyframes k17{0.000%{opacity:0;transform:scale(.85)}53.333%{opacity:0;transform:scale(.85)}56.000%{opacity:1;transform:scale(1)}97.333%{opacity:1;transform:scale(1)}100.000%{opacity:0;transform:scale(.85)}100.000%{opacity:0;transform:scale(.85)}}.k17{animation:k17 15.0s linear infinite both}.k17{transform-box:fill-box;transform-origin:center}@keyframes m18{0%,57.333%{offset-distance:0%;opacity:0}57.343%{opacity:1}61.333%{offset-distance:100%;opacity:1}63.333%,100%{offset-distance:100%;opacity:0}}.m18{offset-path:path('M880 360 L1000 360');offset-rotate:0deg;animation:m18 15.0s linear infinite both}@keyframes k19{0.000%{opacity:0;}58.667%{opacity:0;}61.333%{opacity:1;}97.333%{opacity:1;}100.000%{opacity:0;}100.000%{opacity:0;}}.k19{animation:k19 15.0s linear infinite both}@keyframes k20{0.000%{opacity:0;}61.333%{opacity:0;}62.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k20{animation:k20 15.0s linear infinite both}@keyframes k21{0.000%{opacity:0;}64.333%{opacity:0;}65.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k21{animation:k21 15.0s linear infinite both}@keyframes k22{0.000%{opacity:0;}67.333%{opacity:0;}68.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k22{animation:k22 15.0s linear infinite both}@keyframes k23{0.000%{opacity:0;}70.333%{opacity:0;}71.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k23{animation:k23 15.0s linear infinite both}@keyframes k24{0.000%{opacity:0;}73.333%{opacity:0;}74.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k24{animation:k24 15.0s linear infinite both}@keyframes k25{0.000%{opacity:0;}76.333%{opacity:0;}77.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k25{animation:k25 15.0s linear infinite both}@keyframes k26{0.000%{opacity:0;}79.333%{opacity:0;}80.667%{opacity:1;}97.333%{opacity:1;}98.667%{opacity:0;}100.000%{opacity:0;}}.k26{animation:k26 15.0s linear infinite both}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#172033" stroke-width="1"/></pattern><filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker><marker id="arrw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2e8f0"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs><rect width="1280" height="720" fill="#090d16"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="417" y="22" width="447" height="62" rx="6" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="10 7" class="flow"/><text x="640.0" y="64" fill="#f8fafc" font-size="34" font-weight="600" text-anchor="middle">Survive a Hard Kill</text><text x="640.0" y="110" fill="#94a3b8" font-size="18" text-anchor="middle">kill -9, out-of-memory kills and expired grace periods no longer lose in-flight requests</text><g class="k1" filter="url(#soft)"><rect x="90" y="180" width="420" height="360" rx="16" fill="#f3f7ff" stroke="#f97316" stroke-width="5"/></g><g class="k1"><rect x="188" y="162" width="224" height="36" rx="18" fill="#1d4ed8" stroke="#ffffff" stroke-opacity=".25"/><text x="300" y="186" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">checkout service</text></g><g class="k1"><text x="300" y="236" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">requests in flight</text><rect x="130" y="262" width="340" height="44" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="mono " x="146" y="290" fill="#0f172a" font-size="15" font-weight="600" text-anchor="start">GET /cart</text><rect class="k2" x="318" y="278" width="38" height="12" rx="6" fill="#16a34a"/><rect class="k3" x="364" y="278" width="38" height="12" rx="6" fill="#16a34a"/><rect class="k4" x="410" y="278" width="38" height="12" rx="6" fill="#16a34a"/><rect x="130" y="318" width="340" height="44" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="mono " x="146" y="346" fill="#0f172a" font-size="15" font-weight="600" text-anchor="start">POST /checkout</text><rect class="k5" x="318" y="334" width="38" height="12" rx="6" fill="#f59e0b"/><rect class="k6" x="364" y="334" width="38" height="12" rx="6" fill="#f59e0b"/><rect class="k7" x="410" y="334" width="38" height="12" rx="6" fill="#f59e0b"/><rect x="130" y="374" width="340" height="44" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text class="mono " x="146" y="402" fill="#0f172a" font-size="15" font-weight="600" text-anchor="start">POST /refund</text><rect class="k8" x="318" y="390" width="38" height="12" rx="6" fill="#f59e0b"/><rect class="k9" x="364" y="390" width="38" height="12" rx="6" fill="#f59e0b"/><rect class="k10" x="410" y="390" width="38" height="12" rx="6" fill="#f59e0b"/><text x="300" y="450" fill="#475569" font-size="14" font-weight="400" text-anchor="middle">every buffered record is also copied</text><text x="300" y="470" fill="#475569" font-size="14" font-weight="400" text-anchor="middle">into a shared memory mapping</text></g><g class="" filter="url(#soft)"><rect x="600" y="200" width="280" height="320" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="5"/></g><g class=""><rect x="651" y="182" width="178" height="36" rx="18" fill="#f59e0b" stroke="#ffffff" stroke-opacity=".25"/><text x="740" y="206" fill="#fff" font-size="18" font-weight="600" text-anchor="middle">journal file</text></g><g class="" transform="translate(740 300) scale(1.1)"><path d="M-30 -40h40l20 20v60h-60z" fill="#fff" stroke="#f59e0b" stroke-width="3"/><path d="M10 -40v20h20" fill="#e7efff" stroke="#f59e0b" stroke-width="3"/><rect x="-20" y="-14" width="36" height="5" rx="2" fill="#f59e0b" opacity=".7"/><rect x="-20" y="-2" width="24" height="5" rx="2" fill="#f59e0b" opacity=".7"/><rect x="-20" y="10" width="36" height="5" rx="2" fill="#f59e0b" opacity=".7"/><rect x="-20" y="22" width="24" height="5" rx="2" fill="#f59e0b" opacity=".7"/></g><text x="740" y="390" fill="#0f172a" font-size="15" font-weight="700" text-anchor="middle">mmap ring, checksummed</text><text x="740" y="414" fill="#475569" font-size="14" font-weight="400" text-anchor="middle">kept by the kernel when</text><text x="740" y="434" fill="#475569" font-size="14" font-weight="400" text-anchor="middle">the process dies</text><g class=""><rect x="661" y="466" width="158" height="28" rx="14" fill="#f59e0b"/><text x="740" y="485.0" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">emptyDir volume</text></g><path class=" flow" d="M512 340 L596 340" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 6" marker-end="url(#arr)"/><g class="m11"><circle r="5" fill="#f59e0b" filter="url(#glow)"/></g><g class="m12"><circle r="5" fill="#f59e0b" filter="url(#glow)"/></g><g class="m13"><circle r="5" fill="#f59e0b" filter="url(#glow)"/></g><g class="m14"><circle r="5" fill="#f59e0b" filter="url(#glow)"/></g><g class="m15"><circle r="5" fill="#f59e0b" filter="url(#glow)"/></g><g class="k16"><g class="" transform="translate(300 360) scale(2.0)"><path d="M8 -44L-22 6h20l-8 38l32-52h-20z" fill="#f59e0b" stroke="#fff" stroke-width="2" filter="url(#glow)"/></g><rect x="170" y="560" width="260" height="44" rx="10" fill="#ef4444"/><text class="mono " x="300" y="589" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">kill -9  (no defer runs)</text></g><g class="k17"><rect x="152" y="566" width="296" height="32" rx="16" fill="#1d4ed8"/><text x="300" y="587.8" fill="#fff" font-size="16" font-weight="600" text-anchor="middle">restart: StartJournal(path)</text></g><path class=" flow" d="M882 360 L940 360" fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 6" marker-end="url(#arrg)"/><g class="m18"><circle r="7" fill="#4ade80" filter="url(#glow)"/><rect x="-42" y="-37" width="83" height="22" rx="11" fill="#4ade80"/><text y="-21" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">recover</text></g><g class="k19" filter="url(#soft)"><rect x="940" y="200" width="320" height="320" rx="12" fill="#0b1220" stroke="#1d4ed8" stroke-width="3"/><circle cx="960" cy="218" r="6" fill="#ef4444"/><circle cx="980" cy="218" r="6" fill="#f59e0b"/><circle cx="1000" cy="218" r="6" fill="#22c55e"/><text x="1100.0" y="223" fill="#64748b" font-size="13" text-anchor="middle">next start: logs</text></g><text class="mono k20" x="954" y="252" fill="#cbd5e1" font-size="11.5" xml:space="preserve">{&quot;level&quot;:&quot;DEBUG&quot;,&quot;msg&quot;:&quot;loaded cart&quot;,</text><text class="mono k21" x="954" y="274" fill="#4ade80" font-size="11.5" xml:space="preserve"> &quot;flightrec.flush_reason&quot;:&quot;crash_recovery&quot;,</text><text class="mono k22" x="954" y="296" fill="#4ade80" font-size="11.5" xml:space="preserve"> &quot;flightrec.recovered&quot;:true, ...}</text><text class="mono k23" x="954" y="318" fill="#cbd5e1" font-size="11.5" xml:space="preserve">{&quot;level&quot;:&quot;DEBUG&quot;,&quot;msg&quot;:&quot;charging card&quot;, ...}</text><text class="mono k24" x="954" y="340" fill="#fca5a5" font-size="11.5" xml:space="preserve">{&quot;level&quot;:&quot;ERROR&quot;,</text><text class="mono k25" x="954" y="362" fill="#fca5a5" font-size="11.5" xml:space="preserve"> &quot;msg&quot;:&quot;request interrupted by crash&quot;,</text><text class="mono k26" x="954" y="384" fill="#fca5a5" font-size="11.5" xml:space="preserve"> &quot;method&quot;:&quot;POST&quot;,&quot;path&quot;:&quot;/checkout&quot;, ...}</text><text x="640" y="650" fill="#94a3b8" font-size="15" font-weight="400" text-anchor="middle">Torn writes skipped by checksum  ·  a crash during recovery is retried 3 times  ·  stop() zeros the file</text></svg>